<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時 Dashboard</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #fff8f0; margin: 0; padding: 20px; display: flex; flex-direction: column; gap: 15px; height: 100vh; box-sizing: border-box; overflow: hidden; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* 頂部時間及日期樣式 */
        .header { display: flex; align-items: baseline; gap: 15px; color: #007aff; flex-shrink: 0; flex-wrap: wrap; }
        #time { font-size: 3em; font-weight: bold; }
        .date-section { display: flex; flex-direction: column; justify-content: center; }
        #date { font-size: 1.5em; color: #ff6b81; font-weight: bold; margin-bottom: 3px; }
        #holiday-countdown { font-size: 0.9em; color: #ff9f43; font-weight: bold; background: #fff3e0; padding: 4px 10px; border-radius: 8px; display: inline-block; border: 1px solid #ffeaa7; }
        
        .content { display: flex; gap: 15px; flex: 1; min-height: 0; }
        @media (max-width: 768px) {
            .content { flex-direction: column; overflow-y: auto; }
            body { height: auto; min-height: 100vh; overflow: auto; }
        }
        
        /* 天氣樣式 */
        .weather-panel { flex: 1; display: block; overflow-y: auto; }
        .temp { font-size: 4em; font-weight: bold; color: #ff9f43; margin: 5px 0; }
        #weather-warnings { min-height: 25px; margin-bottom: 5px; }
        .warning-badge { display: inline-block; background-color: #ff4757; color: white; padding: 4px 10px; border-radius: 8px; font-size: 0.9em; font-weight: bold; margin-right: 5px; margin-bottom: 5px; box-shadow: 0 2px 5px rgba(255,71,87,0.3); }
        
        .forecast-container { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .forecast-container h4 { margin: 0 0 8px 0; color: #333; font-size: 1em; }
        #forecast-desc { font-size: 0.95em; color: #555; line-height: 1.5; }
        
        /* 右側欄：包含巴士與交通 */
        .right-column { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        @media (max-width: 768px) {
            .right-column { overflow: visible; }
        }
        
        /* 巴士樣式 */
        .bus-panel { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .bus-item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin: 15px 0; border-bottom: 1px solid #eee; padding-bottom: 12px;}
        .bus-info { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; flex: 1; min-width: 120px; }
        .bus-route { background: #0097e6; color: white; padding: 5px 12px; border-radius: 8px; font-weight: bold; font-size: 1.1em; white-space: nowrap; }
        .bus-station { font-size: 1.1em; font-weight: 500; white-space: nowrap; color: #333; }
        .bus-time { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; }
        .eta { color: #2ed573; font-weight: bold; font-size: 1.3em; }
        .eta-exact { font-size: 0.85em; color: #888; margin-top: 2px; }
        
        /* 交通消息樣式 */
        .traffic-panel { display: flex; flex-direction: column; overflow-y: auto; max-height: 35%; }
        .traffic-item { font-size: 0.95em; color: #555; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 8px; line-height: 1.4; }
        .traffic-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        /* 聖經金句區塊 */
        .bible-panel { padding: 15px 20px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 1px dashed #eee; box-shadow: none; }
        
        /* 音樂按鈕樣式 */
        .audio-panel { padding-top: 15px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; border-top-left-radius: 0; border-top-right-radius: 0; margin-top: -15px; }
        .radio-controls { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 5px; justify-content: center; }
        .radio-btn { flex: 1; min-width: 90px; padding: 10px 12px; border: none; border-radius: 20px; background: #f0f0f0; color: #555; cursor: pointer; font-size: 0.95em; transition: all 0.2s; font-weight: bold; text-align: center; }
        .radio-btn:active { transform: scale(0.95); }
        .radio-btn.active { background: #ff6b81; color: white; box-shadow: 0 2px 5px rgba(255,107,129,0.4); }
        .btn-stop { background: #dcdde1; color: #333; }
        
        #youtube-player { position: absolute; opacity: 0.01; width: 1px; height: 1px; pointer-events: none; }
    </style>
</head>
<body>

    <div class="card header">
        <div id="time">載入中...</div>
        <div class="date-section">
            <div id="date"></div>
            <!-- 公眾假期倒數顯示區 -->
            <div id="holiday-countdown">計算假期中...</div>
        </div>
    </div>

    <div class="content">
        <!-- 左側：天氣 -->
        <div class="card weather-panel">
            <h3 style="margin-top:0;">☀️ 元朗區實時天氣</h3>
            <div id="weather-warnings"></div> 
            <div class="temp"><span id="temperature">--</span>°C</div>
            <p style="margin: 0;">💧 相對濕度: <span id="humidity">--</span>%</p>
            
            <div class="forecast-container">
                <h4>📝 本港地區天氣預測</h4>
                <div id="forecast-desc">載入中...</div>
            </div>
        </div>

        <!-- 右側：巴士 + 交通 -->
        <div class="right-column">
            <div class="card bus-panel">
                <h3 style="margin-top:0;">🚌 269D 往瀝源</h3>
                <div id="bus-data">載入中...</div>
            </div>
            
            <div class="card traffic-panel">
                <h3 style="margin-top:0; font-size: 1.1em; color: #ff9f43;">🚦 最新交通消息</h3>
                <div id="traffic-data">載入中...</div>
            </div>
        </div>
    </div>

    <!-- 底部組合：聖經金句 + 音樂控制台 -->
    <div class="card bible-panel">
        <h3 style="margin-top:0; font-size: 1.05em; color: #6c5ce7; margin-bottom: 8px;">📖 每日金句</h3>
        <div id="bible-verse" style="font-size: 1.05em; color: #444; line-height: 1.5; font-weight: 500;">載入中...</div>
    </div>
    
    <div class="card audio-panel">
        <div class="radio-controls">
            <button onclick="stopRadio()" class="radio-btn btn-stop" id="stop-btn">⏸️ 暫停</button>
            <button onclick="changeRadio('NVhl0tCzFTc', this)" class="radio-btn">✝️ Worship</button>
            <button onclick="changeRadio('OlrHsQ9QexE', this)" class="radio-btn">☕️ Cafe</button>
            <button onclick="changeRadio('rO3e5Ws94NA', this)" class="radio-btn">🎧 Lo-fi</button>
            <button onclick="changeRadio('wdpCxldrZNI', this)" class="radio-btn">🩰 Waltz</button>
        </div>
        <div id="youtube-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let ytPlayer;

        // YouTube 播放器設定
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '1', width: '1', videoId: '', 
                playerVars: { 'playsinline': 1, 'controls': 0 }
            });
        }
        function changeRadio(videoId, btnElement) {
            if (ytPlayer && ytPlayer.loadVideoById) { ytPlayer.loadVideoById(videoId); }
            document.querySelectorAll('.radio-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
        function stopRadio() {
            if (ytPlayer && ytPlayer.pauseVideo) { ytPlayer.pauseVideo(); }
            document.querySelectorAll('.radio-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('stop-btn').classList.add('active');
        }

        // 1. 實時時鐘
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', { month: 'long', day: 'numeric', weekday: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 每日聖經金句 (擴充庫)

                "「你們所遇見的試探，無非是人所能受的。神是信實的，必不叫你們受試探過於所能受的。」(哥林多前書 10:13)",
                "「若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。」(哥林多後書 5:17)",

                "「無論做什麼，都要從心裡做，像是給主做的，不是給人做的。」(歌羅西書 3:23)",

            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
            // 使用質數 7 進行隨機化洗牌，確保每日不同
            const index = (dayOfYear * 7) % verses.length;
            document.getElementById('bible-verse').innerText = verses[index];
        }
        updateBibleVerse();

        // 3. 政府 1823 公眾假期 API (已修復為最新官方網址)
        async function fetchHoliday() {
            try {
                // 使用最新官方 tc.json 檔案
                const res = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.1823.gov.hk/common/ical/tc.json'));
                const data = await res.json();
                const events = data.vcalendar[0].vevent;
                
                const today = new Date();
                today.setHours(0,0,0,0);
                let nextHoliday = null;
                let holidayName = "";
                
                for (let i = 0; i < events.length; i++) {
                    const dateStr = events[i].dtstart[0]; 
                    // 格式: YYYYMMDD
                    const hDate = new Date(dateStr.substring(0,4), parseInt(dateStr.substring(4,6))-1, dateStr.substring(6,8));
                    
                    if (hDate.getTime() === today.getTime()) {
                        document.getElementById('holiday-countdown').innerHTML = `🎉 今日放假啦！(${events[i].summary})`;
                        return;
                    } else if (hDate > today) {
                        nextHoliday = hDate;
                        holidayName = events[i].summary;
                        break;
                    }
                }
                
                if (nextHoliday) {
                    const diffDays = Math.ceil((nextHoliday - today) / (1000 * 60 * 60 * 24));
                    document.getElementById('holiday-countdown').innerHTML = `🏖️ 仲有 <b>${diffDays}</b> 日就放假啦！(${holidayName})`;
                }
            } catch (e) {
                console.error("Holiday API Error:", e);
                document.getElementById('holiday-countdown').innerHTML = '🏖️ 暫無假期資訊';
            }
        }
        fetchHoliday();

        // 4. 天文台天氣 API
        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                const yuenLongTemp = data.temperature.data.find(d => d.place === '元朗公園').value;
                const humidity = data.humidity.data[0].value;
                document.getElementById('temperature').innerText = yuenLongTemp;
                document.getElementById('humidity').innerText = humidity;
            } catch (e) { console.error('天氣載入失敗'); }
        }
        
        // 5. 天文台預測 API
        async function fetchForecast() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc');
                const data = await res.json();
                document.getElementById('forecast-desc').innerText = data.forecastDesc;
            } catch (e) { document.getElementById('forecast-desc').innerText = '預測載入失敗'; }
        }

        // 6. 天文台警告 API
        async function fetchWarnings() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                const data = await res.json();
                const warningContainer = document.getElementById('weather-warnings');
                if (Object.keys(data).length === 0) { warningContainer.innerHTML = ''; return; }
                let warningHtml = '';
                for (const key in data) {
                    if (data[key].name) { warningHtml += `<span class="warning-badge">⚠️ ${data[key].name}</span>`; }
                }
                warningContainer.innerHTML = warningHtml;
            } catch (e) { console.error('警告載入失敗'); }
        }

        fetchWeather(); fetchForecast(); fetchWarnings();
        setInterval(() => { fetchWeather(); fetchForecast(); fetchWarnings(); }, 600000); 

        // 7. 九巴 API 
        async function fetchBus() {
            try {
                const [outRes, inRes] = await Promise.all([
                    fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/269D/outbound/1'),
                    fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/269D/inbound/1')
                ]);
                const outData = await outRes.json();
                const inData = await inRes.json();
                const allStops = [...(outData.data || []), ...(inData.data || [])];
                
                let targetStop = allStops.find(s => {
                    const name = (s.name_tc || "") + (s.name_en || "");
                    return (name.includes('形點') || name.includes('YOHO')) && !name.includes('II') && !name.includes('2');
                });
                if (!targetStop) { targetStop = allStops.find(s => String(s.seq) === '18'); }
                if (!targetStop) throw new Error("搵唔到車站");

                const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${targetStop.stop}`);
                const etaData = await etaRes.json();
                
                let validEtas = (etaData.data || []).filter(eta => 
                    eta.route === '269D' && eta.eta !== null && eta.eta !== "" && (eta.dest_tc && eta.dest_tc.includes('瀝'))
                );
                validEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));

                const uniqueEtas = [];
                const seenTimes = new Set();
                for (const eta of validEtas) {
                    if (!seenTimes.has(eta.eta)) { seenTimes.add(eta.eta); uniqueEtas.push(eta); }
                }

                if (uniqueEtas.length === 0) {
                    document.getElementById('bus-data').innerHTML = '<div style="color: #999; margin-top: 15px; font-weight: bold;">🌙 暫無班次資料</div>';
                    return;
                }

                const html = uniqueEtas.slice(0, 3).map(eta => {
                    const minutes = Math.round((new Date(eta.eta) - new Date()) / 60000);
                    const timeStr = new Date(eta.eta).toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'});
                    return `
                        <div class="bus-item">
                            <div class="bus-info">
                                <span class="bus-route">269D</span>
                                <span class="bus-station">形點 I</span>
                            </div>
                            <div class="bus-time">
                                <span class="eta">${minutes > 0 ? minutes + ' 分鐘' : '即將抵達'}</span>
                                <span class="eta-exact">${timeStr}</span>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('bus-data').innerHTML = html;

            } catch (e) { 
                document.getElementById('bus-data').innerHTML = `<div style="color: #ff6b81; margin-top: 15px; font-weight: bold; font-size: 0.9em;">⚠️ 系統錯誤</div>`;
            }
        }
        fetchBus();
        setInterval(fetchBus, 60000);

        // 8. 交通消息 API
        async function fetchTraffic() {
            try {
                const tdUrl = 'https://www.td.gov.hk/tc/special_news/trafficnews.xml';
                const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(tdUrl)}`);
                const data = await res.json();

                if (data.status !== 'ok' || !data.items || data.items.length === 0) {
                    document.getElementById('traffic-data').innerHTML = '<div style="color: #2ed573; font-weight: bold;">✅ 目前全港交通大致暢順</div>';
                    return;
                }

                let html = '';
                for (let i = 0; i < Math.min(2, data.items.length); i++) {
                    const title = data.items[i].title;
                    html += `<div class="traffic-item">🚗 ${title}</div>`;
                }
                document.getElementById('traffic-data').innerHTML = html;
            } catch (e) {
                document.getElementById('traffic-data').innerHTML = '<div style="color: #999;">暫時無法讀取交通消息</div>';
            }
        }
        fetchTraffic();
        setInterval(fetchTraffic, 300000); 
    </script>
</body>
</html>
