<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>實時 Dashboard</title>
    <style>
        body { font-family: -apple-system, sans-serif; background-color: #fff8f0; margin: 0; padding: 20px; display: flex; flex-direction: column; gap: 15px; height: 100vh; box-sizing: border-box; overflow: hidden; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* 頂部時間及日期樣式 (左右分區設計) */
        .header { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; gap: 10px; }
        .time-section { color: #007aff; }
        #time { font-size: 2.8em; font-weight: bold; line-height: 1; letter-spacing: -1px; }
        .date-section { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
        #date { font-size: 1.3em; color: #ff6b81; font-weight: bold; margin-bottom: 6px; line-height: 1; }
        #holiday-countdown { font-size: 0.85em; color: #ff9f43; font-weight: bold; background: #fff3e0; padding: 5px 10px; border-radius: 8px; border: 1px solid #ffeaa7; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .content { display: flex; gap: 15px; flex: 1; min-height: 0; }
        @media (max-width: 768px) {
            .content { flex-direction: column; overflow-y: auto; }
            body { height: auto; min-height: 100vh; overflow: auto; }
            #time { font-size: 2.4em; } 
        }
        
        /* 天氣樣式 */
        .weather-panel { flex: 1; display: block; overflow-y: auto; }
        .temp { font-size: 4em; font-weight: bold; color: #ff9f43; margin: 5px 0; line-height: 1; }
        #weather-warnings { min-height: 25px; margin-bottom: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
        .warning-badge { display: inline-block; background-color: #ff4757; color: white; padding: 4px 10px; border-radius: 8px; font-size: 0.9em; font-weight: bold; box-shadow: 0 2px 5px rgba(255,71,87,0.3); }
        .badge-safe { background-color: #f1f2f6; color: #576574; box-shadow: none; border: 1px solid #ced6e0; } /* 沒有警告時的灰色標籤 */
        
        /* 全新：四宮格天氣數據面板 */
        .weather-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; text-align: center; }
        .weather-item { background: #f8f9fa; padding: 12px 5px; border-radius: 12px; font-size: 0.85em; color: #555; display: flex; flex-direction: column; gap: 5px; border: 1px solid #eee; }
        .weather-item b { font-size: 1.25em; color: #2f3542; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (max-width: 768px) { .weather-grid { grid-template-columns: repeat(2, 1fr); } }

        .forecast-container { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .forecast-container h4 { margin: 0 0 8px 0; color: #333; font-size: 1em; }
        #forecast-desc { font-size: 0.95em; color: #555; line-height: 1.5; }
        
        /* 右側欄：包含巴士與交通 */
        .right-column { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        @media (max-width: 768px) {
            .right-column { overflow: visible; }
        }
        
        /* 巴士樣式 */
        .bus-panel { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .bus-item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin: 15px 0; border-bottom: 1px solid #eee; padding-bottom: 12px;}
        .bus-info { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; flex: 1; min-width: 120px; }
        .bus-route { background: #0097e6; color: white; padding: 5px 12px; border-radius: 8px; font-weight: bold; font-size: 1.1em; white-space: nowrap; }
        .bus-station { font-size: 1.1em; font-weight: 500; white-space: nowrap; color: #333; }
        .bus-time { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; }
        .eta { color: #2ed573; font-weight: bold; font-size: 1.3em; }
        .eta-exact { font-size: 0.85em; color: #888; margin-top: 2px; }
        
        /* 交通消息樣式 */
        .traffic-panel { display: flex; flex-direction: column; flex: 1; min-height: 220px; padding: 15px; }
        .iframe-container { flex: 1; border-radius: 10px; overflow: hidden; border: 1px solid #eee; background: #f9f9f9; position: relative; }
        
        /* 聖經金句區塊 */
        .bible-panel { padding: 15px 20px; border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 1px dashed #eee; box-shadow: none; }
        
        /* 音樂按鈕樣式 */
        .audio-panel { padding-top: 15px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; border-top-left-radius: 0; border-top-right-radius: 0; margin-top: -15px; }
        .radio-controls { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 5px; justify-content: center; }
        .radio-btn { flex: 1; min-width: 90px; padding: 10px 12px; border: none; border-radius: 20px; background: #f0f0f0; color: #555; cursor: pointer; font-size: 0.95em; transition: all 0.2s; font-weight: bold; text-align: center; }
        .radio-btn:active { transform: scale(0.95); }
        .radio-btn.active { background: #ff6b81; color: white; box-shadow: 0 2px 5px rgba(255,107,129,0.4); }
        .btn-stop { background: #dcdde1; color: #333; }
        
        #youtube-player { position: absolute; opacity: 0.01; width: 1px; height: 1px; pointer-events: none; }
    </style>
</head>
<body>

    <div class="card header">
        <div class="time-section">
            <div id="time">載入中...</div>
        </div>
        <div class="date-section">
            <div id="date"></div>
            <div id="holiday-countdown">計算假期中...</div>
        </div>
    </div>

    <div class="content">
        <div class="card weather-panel">
            <h3 style="margin-top:0;">☀️ 元朗區實時天氣</h3>
            
            <div id="weather-warnings">
                <!-- 警告標籤會在此生成 -->
            </div> 
            
            <div class="temp"><span id="temperature">--</span>°C</div>
            
            <!-- 全新：四宮格氣象數據 -->
            <div class="weather-grid">
                <div class="weather-item">💧 相對濕度<br><b id="humidity">--</b></div>
                <div class="weather-item">☀️ 紫外線<br><b id="uv-index">--</b></div>
                <div class="weather-item">🌬️ 風速<br><b id="wind-speed">--</b></div>
                <div class="weather-item">⚡ 雲對地閃電<br><b id="lightning-info" style="font-size: 1.1em;">--</b></div>
            </div>
            
            <div class="forecast-container">
                <h4>📝 本港地區天氣預測</h4>
                <div id="forecast-desc">載入中...</div>
            </div>
        </div>

        <div class="right-column">
            <div class="card bus-panel">
                <h3 style="margin-top:0;">🚌 269D 往瀝源</h3>
                <div id="bus-data">載入中...</div>
            </div>
            
            <!-- 交通消息直嵌網頁區塊 -->
            <div class="card traffic-panel">
                <h3 style="margin-top:0; font-size: 1.1em; color: #ff9f43; margin-bottom: 10px;">📻 港台即時交通消息</h3>
                <div class="iframe-container">
                    <iframe src="https://programme.rthk.hk/channel/radio/trafficnews/index.php" style="width: 100%; height: 100%; border: none;"></iframe>
                </div>
            </div>
        </div>
    </div>

    <div class="card bible-panel">
        <h3 style="margin-top:0; font-size: 1.05em; color: #6c5ce7; margin-bottom: 8px;">📖 每日金句</h3>
        <div id="bible-verse" style="font-size: 1.05em; color: #444; line-height: 1.5; font-weight: 500;">載入中...</div>
    </div>
    
    <div class="card audio-panel">
        <div class="radio-controls">
            <button onclick="stopRadio()" class="radio-btn btn-stop" id="stop-btn">⏸️ 暫停</button>
            <button onclick="changeRadio('NVhl0tCzFTc', this)" class="radio-btn">✝️ Worship</button>
            <button onclick="changeRadio('OlrHsQ9QexE', this)" class="radio-btn">☕️ Cafe</button>
            <button onclick="changeRadio('rO3e5Ws94NA', this)" class="radio-btn">🎧 Lo-fi</button>
            <button onclick="changeRadio('wdpCxldrZNI', this)" class="radio-btn">🩰 Waltz</button>
        </div>
        <div id="youtube-player"></div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let ytPlayer;

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtube-player', {
                height: '1', width: '1', videoId: '', 
                playerVars: { 'playsinline': 1, 'controls': 0 }
            });
        }
        function changeRadio(videoId, btnElement) {
            if (ytPlayer && ytPlayer.loadVideoById) { ytPlayer.loadVideoById(videoId); }
            document.querySelectorAll('.radio-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }
        function stopRadio() {
            if (ytPlayer && ytPlayer.pauseVideo) { ytPlayer.pauseVideo(); }
            document.querySelectorAll('.radio-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('stop-btn').classList.add('active');
        }

        // 1. 實時時鐘
        function updateClock() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', { month: 'long', day: 'numeric', weekday: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 每日聖經金句
        function updateBibleVerse() {
            const verses = [
                "「當將你的事交託耶和華，並倚靠他，他就必成全。」(詩篇 37:5)",
                "「應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。」(腓立比書 4:6)",
                "「我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。」(哥林多後書 12:9)",
                "「你要專心仰賴耶和華，不可倚靠自己的聰明。」(箴言 3:5)",
                "「凡勞苦擔重擔的人可以到我這裏來，我就使你們得安息。」(馬太福音 11:28)",
                "「神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不致滅亡，反得永生。」(約翰福音 3:16)",
                "「我們曉得萬事都互相效力，叫愛神的人得益處。」(羅馬書 8:28)",
                "「喜樂的心乃是良藥；憂傷的靈使骨枯乾。」(箴言 17:22)",
                "「你不要害怕，因為我與你同在；不要驚惶，因為我是你的神。」(以賽亞書 41:10)",
                "「耶和華是我的牧者，我必不致缺乏。」(詩篇 23:1)",
                "「堅心倚賴你的，你必保守他十分平安，因為他倚靠你。」(以賽亞書 26:3)",
                "「你們看那天上的飛鳥，也不種，也不收，也不積蓄在倉裏，你們的天父尚且養活牠。」(馬太福音 6:26)",
                "「你的話是我腳前的燈，是我路上的光。」(詩篇 119:105)",
                "「要常常喜樂，不住地禱告，凡事謝恩。」(帖撒羅尼迦前書 5:16-18)",
                "「我靠著那加給我力量的，凡事都能做。」(腓立比書 4:13)",
                "「耶和華說：我知道我向你們所懷的意念，是賜平安的意念，不是降災禍的意念。」(耶利米書 29:11)",
                "「但願使人有盼望的神，因信將諸般的喜樂、平安充滿你們的心。」(羅馬書 15:13)",
                "「神是我們的避難所，是我們的力量，是我們在患難中隨時的幫助。」(詩篇 46:1)",
                "「但那等候耶和華的，必重新得力。他們必如鷹展翅上騰。」(以賽亞書 40:31)",
                "「信就是所望之事的實底，是未見之事的確據。」(希伯來書 11:1)"
            ];
            const now = new Date();
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
            const index = (dayOfYear * 7) % verses.length;
            document.getElementById('bible-verse').innerText = verses[index];
        }
        updateBibleVerse();

        // 3. 政府假期 API
        async function fetchHoliday() {
            try {
                const url = 'https://www.1823.gov.hk/common/ical/tc.json';
                let data = null;
                try {
                    const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
                    if (!res.ok) throw new Error("Proxy Failed");
                    data = await res.json();
                } catch (err) { throw new Error("Network Fetch Failed"); }

                const events = data.vcalendar[0].vevent;
                calculateNextHoliday(events);
            } catch (e) {
                const fallbackEvents = [
                    { dtstart: ["20240918"], summary: "中秋節翌日" }, { dtstart: ["20241001"], summary: "國慶日" }, { dtstart: ["20241011"], summary: "重陽節" }, { dtstart: ["20241225"], summary: "聖誕節" }, { dtstart: ["20241226"], summary: "聖誕節後第一個周日" },
                    { dtstart: ["20250101"], summary: "元旦" }, { dtstart: ["20250129"], summary: "農曆年初一" }, { dtstart: ["20250418"], summary: "耶穌受難節" }, { dtstart: ["20250421"], summary: "復活節" }, { dtstart: ["20250501"], summary: "勞動節" }, { dtstart: ["20250505"], summary: "佛誕" }, { dtstart: ["20250531"], summary: "端午節" }, { dtstart: ["20250701"], summary: "特區成立紀念日" }, { dtstart: ["20251001"], summary: "國慶日" }, { dtstart: ["20251007"], summary: "中秋節翌日" }, { dtstart: ["20251029"], summary: "重陽節" }, { dtstart: ["20251225"], summary: "聖誕節" }, { dtstart: ["20251226"], summary: "聖誕節後第一個周日" },
                    { dtstart: ["20260101"], summary: "元旦" }, { dtstart: ["20260217"], summary: "農曆年初一" }, { dtstart: ["20260403"], summary: "耶穌受難節" }, { dtstart: ["20260406"], summary: "復活節" }, { dtstart: ["20260501"], summary: "勞動節" }, { dtstart: ["20260524"], summary: "佛誕" }, { dtstart: ["20260619"], summary: "端午節" }, { dtstart: ["20260701"], summary: "特區成立紀念日" }, { dtstart: ["20260926"], summary: "中秋節翌日" }, { dtstart: ["20261001"], summary: "國慶日" }, { dtstart: ["20261019"], summary: "重陽節" }, { dtstart: ["20261225"], summary: "聖誕節" }, { dtstart: ["20261226"], summary: "聖誕節後第一個周日" }
                ];
                calculateNextHoliday(fallbackEvents);
            }
        }

        function calculateNextHoliday(events) {
            const today = new Date();
            today.setHours(0,0,0,0);
            events.sort((a, b) => parseInt(a.dtstart[0]) - parseInt(b.dtstart[0]));
            let nextHoliday = null;
            let holidayName = "";
            for (let i = 0; i < events.length; i++) {
                const dateStr = events[i].dtstart[0]; 
                if (!dateStr || dateStr.length < 8) continue;
                const hDate = new Date(parseInt(dateStr.substring(0,4)), parseInt(dateStr.substring(4,6)) - 1, parseInt(dateStr.substring(6,8)));
                if (hDate.getTime() === today.getTime()) {
                    document.getElementById('holiday-countdown').innerHTML = `🎉 今日放假啦！(${events[i].summary})`; return;
                } else if (hDate > today) { nextHoliday = hDate; holidayName = events[i].summary; break; }
            }
            if (nextHoliday) {
                const diffTime = Math.abs(nextHoliday - today);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                document.getElementById('holiday-countdown').innerHTML = `🏖️ 仲有 <b>${diffDays}</b> 日就放假啦！(${holidayName})`;
            }
        }
        fetchHoliday();

        // 4. 天文台天氣 API (包含溫度、濕度、紫外線、閃電)
        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                // 溫度
                const yuenLongTemp = data.temperature.data.find(d => d.place === '元朗公園').value;
                document.getElementById('temperature').innerText = yuenLongTemp;
                
                // 濕度
                const humidity = data.humidity.data[0].value;
                document.getElementById('humidity').innerText = humidity + '%';

                // 紫外線指數
                if (data.uvindex && data.uvindex.data && data.uvindex.data.length > 0) {
                    const uvVal = data.uvindex.data[0].value;
                    const uvDesc = data.uvindex.data[0].desc;
                    document.getElementById('uv-index').innerHTML = `${uvVal} <span style="font-size:0.7em">(${uvDesc})</span>`;
                } else {
                    document.getElementById('uv-index').innerText = '0 (低)';
                }

                // 雲對地閃電資訊
                let lightningStr = '沒有';
                if (data.lightning && data.lightning.data) {
                    const activePlaces = data.lightning.data.filter(d => d.occur === "true").map(d => d.place);
                    if (activePlaces.length > 0) {
                        lightningStr = `有 (${activePlaces[0]})`; // 顯示首個有閃電的地區
                    }
                }
                document.getElementById('lightning-info').innerText = lightningStr;

            } catch (e) {}
        }
        
        // 5. 天文台風速 API (從地區氣象站 CSV 讀取 10分鐘平均風速)
        async function fetchWind() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_10min_wind_uc.csv');
                if (res.ok) {
                    const text = await res.text();
                    const lines = text.split('\n');
                    let windSpeed = '--';
                    
                    // 尋找元朗區鄰近嘅測風站 (流浮山 / 濕地公園 / 元朗公園)
                    for (let line of lines) {
                        if (line.includes('流浮山') || line.includes('濕地公園') || line.includes('元朗公園')) {
                            const cols = line.split(',');
                            if (cols.length >= 4 && cols[3].trim() !== '') {
                                windSpeed = cols[3].trim() + ' km/h';
                                break;
                            }
                        }
                    }
                    if (windSpeed !== '--') {
                        document.getElementById('wind-speed').innerText = windSpeed;
                    }
                }
            } catch (e) {}
        }

        // 6. 天文台預測 API
        async function fetchForecast() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=tc');
                const data = await res.json();
                document.getElementById('forecast-desc').innerText = data.forecastDesc;
            } catch (e) {}
        }

        // 7. 天文台及勞工處綜合警告 API (必顯示暑熱狀態)
        async function fetchWarnings() {
            try {
                let warningHtml = '';
                const warningContainer = document.getElementById('weather-warnings');

                // A. 讀取天文台常規警告 (雷暴、酷熱等)
                try {
                    const warnRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                    if (warnRes.ok) {
                        const warnData = await warnRes.json();
                        for (const key in warnData) {
                            if (warnData[key].name) { 
                                warningHtml += `<span class="warning-badge">⚠️ ${warnData[key].name}</span>`; 
                            }
                        }
                    }
                } catch (e) {}

                // B. 讀取工作暑熱警告 (無論有無生效都會顯示狀態)
                let hswwBadge = `<span class="warning-badge badge-safe">✅ 沒有工作暑熱警告</span>`;
                try {
                    const hswwRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/hsww.php?lang=tc');
                    if (hswwRes.ok) {
                        const hswwText = await hswwRes.text();
                        if (hswwText && hswwText.trim() !== '{}' && hswwText.trim() !== '') {
                            const strData = hswwText.toUpperCase();
                            if (!strData.includes("CANCEL") && !strData.includes("取消")) {
                                if (strData.includes("黑") || strData.includes("BLACK")) {
                                    hswwBadge = `<span class="warning-badge" style="background-color: #2f3542; color: white;">🥵 黑色工作暑熱警告</span>`;
                                } else if (strData.includes("紅") || strData.includes("RED")) {
                                    hswwBadge = `<span class="warning-badge" style="background-color: #ff4757; color: white;">🥵 紅色工作暑熱警告</span>`;
                                } else if (strData.includes("黃") || strData.includes("AMBER") || strData.includes("YELLOW")) {
                                    hswwBadge = `<span class="warning-badge" style="background-color: #f39c12; color: white;">🥵 黃色工作暑熱警告</span>`;
                                } else if (strData.includes("暑熱") || strData.includes("HEAT")) {
                                    hswwBadge = `<span class="warning-badge" style="background-color: #e67e22; color: white;">🥵 工作暑熱警告生效</span>`;
                                }
                            }
                        }
                    }
                } catch (e) {}

                // 如果常規警告無包含「暑熱」字眼，才加入獨立的暑熱標籤防重疊
                if (!warningHtml.includes("暑熱")) {
                    warningHtml += hswwBadge;
                }

                warningContainer.innerHTML = warningHtml;
            } catch (e) {}
        }

        // 啟動所有氣象數據讀取
        function updateAllWeather() {
            fetchWeather();
            fetchWind();
            fetchForecast();
            fetchWarnings();
        }
        updateAllWeather();
        setInterval(updateAllWeather, 600000); 

        // 8. 九巴 API 
        async function fetchBus() {
            try {
                const [outRes, inRes] = await Promise.all([
                    fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/269D/outbound/1'),
                    fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/269D/inbound/1')
                ]);
                const outData = await outRes.json();
                const inData = await inRes.json();
                const allStops = [...(outData.data || []), ...(inData.data || [])];
                
                let targetStop = allStops.find(s => {
                    const name = (s.name_tc || "") + (s.name_en || "");
                    return (name.includes('形點') || name.includes('YOHO')) && !name.includes('II') && !name.includes('2');
                });
                if (!targetStop) { targetStop = allStops.find(s => String(s.seq) === '18'); }
                if (!targetStop) throw new Error("搵唔到車站");

                const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${targetStop.stop}`);
                const etaData = await etaRes.json();
                
                let validEtas = (etaData.data || []).filter(eta => 
                    eta.route === '269D' && eta.eta !== null && eta.eta !== "" && (eta.dest_tc && eta.dest_tc.includes('瀝'))
                );
                validEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));

                const uniqueEtas = [];
                const seenTimes = new Set();
                for (const eta of validEtas) {
                    if (!seenTimes.has(eta.eta)) { seenTimes.add(eta.eta); uniqueEtas.push(eta); }
                }

                if (uniqueEtas.length === 0) {
                    document.getElementById('bus-data').innerHTML = '<div style="color: #999; margin-top: 15px; font-weight: bold;">🌙 暫無班次資料</div>';
                    return;
                }

                const html = uniqueEtas.slice(0, 3).map(eta => {
                    const minutes = Math.round((new Date(eta.eta) - new Date()) / 60000);
                    const timeStr = new Date(eta.eta).toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit'});
                    return `
                        <div class="bus-item">
                            <div class="bus-info">
                                <span class="bus-route">269D</span>
                                <span class="bus-station">形點 I</span>
                            </div>
                            <div class="bus-time">
                                <span class="eta">${minutes > 0 ? minutes + ' 分鐘' : '即將抵達'}</span>
                                <span class="eta-exact">${timeStr}</span>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('bus-data').innerHTML = html;

            } catch (e) { 
                document.getElementById('bus-data').innerHTML = `<div style="color: #ff6b81; margin-top: 15px; font-weight: bold; font-size: 0.9em;">⚠️ 系統錯誤</div>`;
            }
        }
        fetchBus();
        setInterval(fetchBus, 60000);

    </script>
